<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Cappers &amp; Code color palette</title>
  <desc id="desc">Approved near-black, charcoal, electric green, signal green, white, and muted gray colors.</desc>
  <rect width="1200" height="500" fill="#050608"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <rect x="60" y="60" width="170" height="280" rx="18" fill="#050608" stroke="#2a2e2a"/>
    <rect x="242" y="60" width="170" height="280" rx="18" fill="#0B0E0C" stroke="#2a2e2a"/>
    <rect x="424" y="60" width="170" height="280" rx="18" fill="#B6FF00"/>
    <rect x="606" y="60" width="170" height="280" rx="18" fill="#79E000"/>
    <rect x="788" y="60" width="170" height="280" rx="18" fill="#F5F7F2"/>
    <rect x="970" y="60" width="170" height="280" rx="18" fill="#9DA59D"/>
    <g font-size="22" text-anchor="middle">
      <text x="145" y="385" fill="#F5F7F2">NEAR BLACK</text><text x="145" y="420" fill="#9DA59D">#050608</text>
      <text x="327" y="385" fill="#F5F7F2">CHARCOAL</text><text x="327" y="420" fill="#9DA59D">#0B0E0C</text>
      <text x="509" y="385" fill="#F5F7F2">ELECTRIC</text><text x="509" y="420" fill="#B6FF00">#B6FF00</text>
      <text x="691" y="385" fill="#F5F7F2">SIGNAL</text><text x="691" y="420" fill="#79E000">#79E000</text>
      <text x="873" y="385" fill="#F5F7F2">SOFT WHITE</text><text x="873" y="420" fill="#9DA59D">#F5F7F2</text>
      <text x="1055" y="385" fill="#F5F7F2">MUTED</text><text x="1055" y="420" fill="#9DA59D">#9DA59D</text>
    </g>
  </g>
</svg>


<!doctype html>
<html><head><meta charset="utf-8"><title>Cappers & Code · TNF promo</title>
<style>
  @font-face { font-family: 'Barlow Condensed'; font-weight: 900; src: url(assets/fonts/BarlowCondensed_900Black.ttf); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 800; src: url(assets/fonts/BarlowCondensed_800ExtraBold.ttf); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 900; font-style: italic; src: url(assets/fonts/BarlowCondensed_900Black_Italic.ttf); }
  @font-face { font-family: 'Manrope'; font-weight: 700; src: url(assets/fonts/Manrope_700Bold.ttf); }
  @font-face { font-family: 'Manrope'; font-weight: 500; src: url(assets/fonts/Manrope_500Medium.ttf); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url(assets/fonts/JetBrainsMono_700Bold.ttf); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(assets/fonts/JetBrainsMono_500Medium.ttf); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#050608; color:#F5F7F2; font-family:'Manrope',sans-serif; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:#050608; }
  .carbon { position:absolute; inset:0; background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, transparent 1px 28px); }
  .glow { position:absolute; left:50%; top:62%; width:1400px; height:1400px; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(182,255,0,.28) 0%, rgba(182,255,0,.08) 30%, transparent 62%); }
  .smoke { position:absolute; width:900px; height:700px; border-radius:50%; filter:blur(90px); background:radial-gradient(circle, rgba(121,224,0,.35), rgba(182,255,0,.06) 55%, transparent 70%); }
  .scan { position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 2px, transparent 2px 5px); mix-blend-mode:multiply; }
  .sweep { position:absolute; left:0; right:0; height:260px; background:linear-gradient(180deg, transparent, rgba(182,255,0,.35) 50%, transparent); }
  .vig { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.8) 100%); }
  .flash { position:absolute; inset:0; background:#B6FF00; opacity:0; mix-blend-mode:screen; }
  .confetti { position:absolute; width:14px; height:26px; background:#B6FF00; opacity:.85; }
  .logo { position:absolute; left:50%; top:110px; width:480px; transform:translateX(-50%); }
  .robot { position:absolute; left:50%; bottom:-40px; width:1000px; transform:translateX(-50%); filter:drop-shadow(0 0 40px rgba(182,255,0,.55)) drop-shadow(0 0 120px rgba(182,255,0,.25)); }
  .layer { position:absolute; inset:0; }
  .head { position:absolute; left:64px; right:64px; text-align:center; font-family:'Barlow Condensed'; font-weight:900; text-transform:uppercase; line-height:.9; letter-spacing:1px; color:#F5F7F2; text-shadow:0 6px 30px rgba(0,0,0,.7); }
  .head .g { color:#B6FF00; text-shadow:0 0 30px rgba(182,255,0,.55); }
  .energy { font-family:'Barlow Condensed'; font-weight:900; font-style:italic; color:#B6FF00; text-transform:uppercase; transform:skew(-6deg); text-shadow:0 0 36px rgba(182,255,0,.7), 0 0 90px rgba(182,255,0,.35); }
  .panel { position:absolute; border:1px solid rgba(182,255,0,.45); border-radius:14px; background:rgba(11,14,12,.82); box-shadow:0 0 24px rgba(182,255,0,.25), inset 0 0 40px rgba(0,0,0,.6); padding:22px 28px; backdrop-filter:blur(6px); }
  .panel .k { font-family:'JetBrains Mono'; font-weight:700; font-size:22px; letter-spacing:4px; color:#B6FF00; }
  .panel .v { font-family:'Barlow Condensed'; font-weight:800; font-size:64px; line-height:1; margin-top:8px; text-transform:uppercase; }
  .panel .v small { font-family:'JetBrains Mono'; font-weight:500; font-size:26px; color:#9DA59D; display:block; margin-top:6px; text-transform:none; letter-spacing:0; }
  .chip { position:absolute; left:64px; right:64px; border:1px solid rgba(182,255,0,.55); border-left:14px solid #B6FF00; border-radius:14px; background:rgba(11,14,12,.9); padding:26px 36px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 0 30px rgba(182,255,0,.22); }
  .chip .t { font-family:'Barlow Condensed'; font-weight:800; font-size:78px; text-transform:uppercase; line-height:1; }
  .chip .p { font-family:'JetBrains Mono'; font-weight:700; font-size:60px; color:#B6FF00; }
  .cta { position:absolute; left:50%; transform:translateX(-50%); background:#B6FF00; color:#050608; font-family:'Barlow Condensed'; font-weight:900; font-size:56px; letter-spacing:3px; text-transform:uppercase; padding:22px 54px; border-radius:12px; box-shadow:0 0 40px rgba(182,255,0,.55); white-space:nowrap; }
  .foot { position:absolute; bottom:80px; left:0; right:0; text-align:center; font-family:'JetBrains Mono'; font-weight:700; font-size:26px; letter-spacing:6px; color:#79E000; }
  .mono { font-family:'JetBrains Mono'; }
</style></head>
<body><div id="stage">
  <div class="carbon"></div>
  <div class="glow" id="glow"></div>
  <div class="smoke" id="sm1"></div><div class="smoke" id="sm2"></div><div class="smoke" id="sm3"></div>
  <div id="confetti"></div>
  <img class="robot" id="robot" src="assets/robot.png">
  <div class="scan"></div>
  <div class="sweep" id="sweep"></div>
  <img class="logo" id="logo" src="assets/lockup.png">
  <div class="layer" id="ui"></div>
  <div class="vig"></div>
  <div class="flash" id="flash"></div>
  <div class="foot" id="foot">AI MODELS · HUMAN INSIGHT · ONE EDGE</div>
</div>
<script>
const q=new URLSearchParams(location.search); const t=parseFloat(q.get('t')||'0');
const $=id=>document.getElementById(id); const ui=$('ui');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const ease=x=>1-Math.pow(1-clamp(x,0,1),3); const eo=x=>{x=clamp(x,0,1);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const cuts=[0,3,7,11,13]; const cut=cuts.filter(c=>t>=c).pop(); const lt=t-cut;
function el(cls,html,style){const d=document.createElement('div');d.className=cls;d.innerHTML=html;if(style)d.setAttribute('style',style);ui.appendChild(d);return d;}
// atmosphere
$('sm1').style.transform=`translate(${-120+Math.sin(t*.7)*80}px,${1100+Math.cos(t*.5)*60}px)`;
$('sm2').style.transform=`translate(${420+Math.cos(t*.6)*90}px,${1250+Math.sin(t*.4)*50}px)`;
$('sm3').style.transform=`translate(${150+Math.sin(t*.9)*60}px,${700+Math.cos(t*.8)*40}px) scale(.8)`;
const cf=$('confetti'); for(let i=0;i<30;i++){const s=Math.sin(i*12.9898)*43758.5453;const r=s-Math.floor(s);const r2=(r*7.31)%1;const x=r*1080;const y=((r2*1920)+t*(90+r*160))%2100-100;const d=document.createElement('div');d.className='confetti';d.style.transform=`translate(${x}px,${y}px) rotate(${(t*120*(r-.5)+r*360)}deg)`;d.style.opacity=(.25+r2*.4).toFixed(2);cf.appendChild(d);}
// shake + flash on cuts
const shake=lt<0.16?(0.16-lt)*90:0; const sx=Math.sin(t*97)*shake, sy=Math.cos(t*83)*shake; $('stage').style.transform=`translate(${sx}px,${sy}px) scale(${1+shake*0.003})`;
$('flash').style.opacity=lt<0.1?(1-lt/0.1)*0.85:0;
const robot=$('robot'), logo=$('logo'), sweep=$('sweep'), glow=$('glow');
robot.style.opacity=0; logo.style.opacity=1; sweep.style.opacity=0;
if(cut===0){ // 0-3 tunnel + logo macro. "DATA DOESN'T GUESS."
  sweep.style.opacity=1; sweep.style.top=`${(t/3)*2100-260}px`;
  const e=ease(lt/1.2); logo.style.width='700px'; logo.style.top='560px'; logo.style.transform=`translateX(-50%) scale(${2.4-1.4*e})`; logo.style.opacity=e;
  glow.style.opacity=.6*e;
  el('head',`DATA DOESN'T<br><span class="g">GUESS.</span>`,`top:1080px;font-size:210px;opacity:${ease((lt-1.3)/0.35)};transform:scale(${0.85+0.15*ease((lt-1.3)/0.35)})`);
  el('panel mono',`<div class="k">WEEK 2 · THURSDAY NIGHT</div><div class="v">Lions at Bills<small>8:15 ET · Orchard Park</small></div>`,`left:64px;right:64px;top:1530px;opacity:${ease((lt-2.0)/0.4)}`);
}
if(cut===3){ // 3-7 robot rises through smoke, panels assemble. "IT FINDS THE EDGE."
  const e=eo(lt/1.1); robot.style.opacity=e; robot.style.transform=`translateX(-50%) translateY(${300+(1-e)*520}px)`; robot.style.width='1040px'; glow.style.opacity=.9;
  const panels=[['MATCHUP','Lions at Bills','8:15 ET · Orchard Park','left:64px;top:400px;width:470px'],['LINE','BUF -5.5','O/U 54.5 · BUF -250','right:64px;top:400px;width:470px'],['MODEL','DET 26 · BUF 30','edge on the Over','left:64px;top:640px;width:470px'],['WEEK 1','+23.90u','Locked In 11-5','right:64px;top:640px;width:470px']];
  panels.forEach((p,i)=>{const pe=ease((lt-0.6-i*0.35)/0.3); el('panel',`<div class="k">${p[0]}</div><div class="v">${p[1]}<small>${p[2]}</small></div>`,`${p[3]};opacity:${pe};transform:translateY(${(1-pe)*40}px)`);});
  el('head',`IT FINDS<br><span class="g">THE EDGE.</span>`,`top:1380px;font-size:200px;opacity:${ease((lt-2.4)/0.35)};transform:translateY(${(1-ease((lt-2.4)/0.35))*60}px)`);
}
if(cut===7){ // 7-11 montage of plays. "AI MODELS. HUMAN INSIGHT."
  robot.style.opacity=.35; robot.style.transform='translateX(-50%) translateY(180px)'; robot.style.width='1040px'; glow.style.opacity=.5;
  const hd=lt<2?`AI<br><span class="g">MODELS.</span>`:`HUMAN<br><span class="g">INSIGHT.</span>`; el('head',hd,`top:360px;font-size:170px;opacity:${ease(((lt%2))/0.25)}`);
  const plays=[['Bills -4.5 or better','-110'],['Over 54.5','-110'],['St. Brown anytime','+105'],['Allen 2+ TDs','+470'],['St. Brown + Moore','+405']];
  plays.forEach((p,i)=>{const s=0.4+i*0.62; const pe=ease((lt-s)/0.22); if(lt<s) return; el('chip',`<div class="t">${p[0]}</div><div class="p">${p[1]}</div>`,`top:${820+i*190}px;opacity:${pe};transform:translateX(${(1-pe)*-420}px)`);});
}
if(cut===11){ // 11-13 hero lockup. "ONE EDGE."
  robot.style.opacity=1; robot.style.width='1120px'; robot.style.transform=`translateX(-50%) translateY(${240-eo(lt/1.2)*60}px) scale(${1+eo(lt/2)*0.04})`; glow.style.opacity=1;
  const e=ease(lt/0.4); el('head',`<span class="g">ONE EDGE.</span>`,`top:400px;font-size:230px;opacity:${e};letter-spacing:6px;transform:scale(${0.8+0.2*e})`);
  el('',``,`position:absolute;left:${540-540*ease((lt-0.3)/0.6)}px;width:${1080*ease((lt-0.3)/0.6)}px;top:690px;height:6px;background:#B6FF00;box-shadow:0 0 30px #B6FF00`);
}
if(cut===13){ // 13-15 end card / offer
  robot.style.opacity=.3; robot.style.width='1120px'; robot.style.transform='translateX(-50%) translateY(420px)'; glow.style.opacity=.9;
  const e=ease(lt/0.35);
  el('energy',`$20`,`position:absolute;left:0;right:0;top:360px;text-align:center;font-size:400px;line-height:1;opacity:${e};transform:skew(-6deg) scale(${0.6+0.4*e}) rotate(${(1-e)*-6}deg)`);
  el('head',`THE ENTIRE<br>FOOTBALL SEASON`,`top:820px;font-size:118px;letter-spacing:2px;opacity:${ease((lt-0.35)/0.3)}`);
  el('panel',`<div class="k">FOUNDING 100</div><div class="v" style="font-size:44px">First 100 members grandfathered<small>through the end of the NBA season</small></div>`,`left:64px;right:64px;top:1130px;opacity:${ease((lt-0.7)/0.3)}`);
  el('cta',`Link in bio · @cappersandcode`,`top:1420px;opacity:${ease((lt-1.0)/0.3)};transform:translateX(-50%) scale(${1+0.03*Math.sin(t*16)})`);
}
</script></body></html>

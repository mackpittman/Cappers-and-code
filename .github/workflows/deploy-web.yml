name: Deploy web app

# Publishes the Expo web build to GitHub Pages so members can use the app from a link
# (and add it to their home screen) without an app store.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'brand/**'
      - 'assets/**'
      - 'public/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/postbuild-web.mjs'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Export web build
        env:
          EXPO_WEB_BASE_URL: ${{ steps.pages.outputs.base_path }}
          CI: '1'
        run: pnpm exec expo export --platform web && node scripts/postbuild-web.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

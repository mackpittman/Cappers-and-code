name: Deploy site and web app

# Publishes the public site (landing, legal pages) and the Expo web app to GitHub Pages so members
# use the app from a link and add it to their home screen. No app store involved.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'site/**'
      - 'brand/**'
      - 'assets/**'
      - 'public/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/build-site.mjs'
      - 'scripts/postbuild-web.mjs'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site and web app
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPO_WEB_BASE_URL: ${{ steps.pages.outputs.base_path }}/app
          WEB_APP_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}/app
          CI: '1'
        run: pnpm build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

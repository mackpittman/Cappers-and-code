name: Cappers & Code daily board

# The schedule is OFF. This workflow has no secrets set, so every scheduled run rebuilt the board
# from whatever stale snapshot happened to be in the repo and pushed it over main, while reporting
# success. The Claude Routine is the live scheduler and it has the real keys.
#
# To make this the scheduler instead: add ODDS_API_KEY, SUPABASE_URL, SUPABASE_ANON_KEY and
# BOARD_PUBLISH_SECRET as repository secrets, uncomment the schedule below, and disable the
# Routine so two schedulers are never spending the same credit budget.
on:
  # schedule:
  #   - cron: '0 11 * * *'   # daily 7am ET: free feeds
  #   - cron: '0 16 * * 2'   # Tue 12pm ET: ATD openers
  #   - cron: '0 16 * * 3'   # Wed 12pm ET: late openers
  #   - cron: '30 23 * * 5'  # Fri 7:30pm ET: post-designations
  #   - cron: '30 22 * * 4'  # Thu 6:30pm ET: TNF pre-kick
  #   - cron: '30 16 * * 0'  # Sun 12:30pm ET: Sunday slate
  #   - cron: '30 22 * * 1'  # Mon 6:30pm ET: MNF pre-kick
  workflow_dispatch:
    inputs:
      force_phase:
        description: 'Force a props phase for every upcoming game (open, desig, prekick). Leave blank for the normal calendar.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Refuse to run without inputs. Without this the scripts no-op, the board is rebuilt from a
      # stale snapshot, and the commit step pushes it over main with a green check.
      - name: Require the secrets this pipeline actually needs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BOARD_PUBLISH_SECRET: ${{ secrets.BOARD_PUBLISH_SECRET }}
        run: |
          missing=""
          for v in ODDS_API_KEY SUPABASE_URL SUPABASE_ANON_KEY BOARD_PUBLISH_SECRET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to run: missing repository secrets:$missing"
            echo "Set them in Settings > Secrets and variables > Actions, or leave this workflow off."
            exit 1
          fi

      - name: Restore pipeline state so credits are never spent twice
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BOARD_PUBLISH_SECRET: ${{ secrets.BOARD_PUBLISH_SECRET }}
        run: node scripts/state-sync.mjs pull

      - name: Fetch schedule, injuries and props, rebuild board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BOARD_PUBLISH_SECRET: ${{ secrets.BOARD_PUBLISH_SECRET }}
          FORCE_PHASE: ${{ github.event.inputs.force_phase }}
          CREDIT_RESERVE: '40'
          MAX_CREDITS_PER_RUN: '80'
        run: |
          node scripts/fetch-schedule.mjs
          node scripts/fetch-injuries.mjs
          node scripts/fetch-odds.mjs
          node scripts/grade-results.mjs
          node scripts/build-board.mjs
          node scripts/publish-board.mjs
          node scripts/state-sync.mjs push
          node scripts/post-discord.mjs
      - name: Commit updated data
        run: |
          git config user.name "cappers-bot"
          git config user.email "cappers-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: board update $(date -u +%FT%H:%MZ)"
          git pull --rebase
          git push
      - name: Publish board.json to a public Gist (optional, gives the app a keyless URL)
        if: ${{ env.GIST_ID != '' && env.GIST_TOKEN != '' }}
        env:
          GIST_ID: ${{ secrets.BOARD_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const body = { files: { "board.json": { content: fs.readFileSync("data/board.json", "utf8") } } };
            fetch(`https://api.github.com/gists/${process.env.GIST_ID}`, {
              method: "PATCH",
              headers: { Authorization: `Bearer ${process.env.GIST_TOKEN}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
              body: JSON.stringify(body),
            }).then(async (r) => { console.log("gist", r.status); if (!r.ok) { console.log(await r.text()); process.exit(1); } });
          '
